<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chromospace</title>
<meta name="description" content="Chromospace: a personal collection of street art, prints, paintings, trading cards and NFTs, with a new piece every day.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: gallery wall. One dark room, the works carry the colour; each category owns one hue of the spectrum.
   Home = piece of the day + a curated NFT selection + artists. Every artist has a page. */
:root{
  --ink:#0c0e13;
  --panel:#151821;
  --line:#272b38;
  --text:#ecebf1;
  --muted:#8f94a6;
  --c-nft:#8b6cff;
  --c-street:#ff4d6d;
  --c-prints:#2ec4f1;
  --c-paintings:#ffb020;
  --c-cards:#3ddc97;
  --spectrum:linear-gradient(90deg,var(--c-street),var(--c-paintings),var(--c-cards),var(--c-prints),var(--c-nft));
  --f-display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
  --f-body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --gutter:clamp(16px,4vw,48px);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--c-prints);outline-offset:3px;border-radius:4px}
.spectrum-rule{height:3px;background:var(--spectrum)}
.wrap{max-width:1280px;margin:0 auto;padding:0 var(--gutter)}
.mono{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.02em;font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}

/* Header */
header.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:20px 0}
.brand{font-family:var(--f-display);font-weight:700;font-size:26px;letter-spacing:-.03em;text-decoration:none;display:flex;align-items:baseline}
.brand span{color:var(--muted);font-weight:400}
nav.main{display:flex;gap:6px;flex-wrap:wrap}
nav.main a{text-decoration:none;color:var(--muted);font-weight:500;font-size:15px;padding:6px 12px;border-radius:999px}
nav.main a:hover{color:var(--text)}
nav.main a[aria-current="page"]{color:var(--ink);background:var(--text)}
.status{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:13px;color:var(--muted);max-width:100%}
.status i{width:8px;height:8px;border-radius:50%;background:var(--c-paintings);flex:none}
.status.ok i{background:var(--c-cards)}

/* Hero */
.hero{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:clamp(24px,5vw,72px);align-items:center;padding:28px 0 56px}
.frame{position:relative;background:var(--panel);border-radius:6px;padding:clamp(14px,2.4vw,28px);box-shadow:0 30px 80px -30px rgba(0,0,0,.8)}
.frame img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:2px;background:#1b1f2a}
.frame .bar{position:absolute;left:0;right:0;bottom:0;height:5px;border-radius:0 0 6px 6px;background:var(--cat,var(--spectrum))}
.badge-new{position:absolute;top:26px;left:26px;background:var(--text);color:var(--ink);font-weight:600;font-size:12px;padding:5px 10px;border-radius:999px;letter-spacing:.04em;text-transform:uppercase}
.eyebrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:14px;margin-bottom:14px}
.eyebrow b{color:var(--text);font-weight:600}
h1.title{font-family:var(--f-display);font-weight:650;font-size:clamp(36px,5.4vw,76px);line-height:.98;letter-spacing:-.035em;margin:0 0 14px;text-wrap:balance;overflow-wrap:anywhere}
.byline{font-size:19px;margin:0 0 22px}
.byline a{text-decoration-color:var(--line);text-underline-offset:4px}
.byline a:hover{text-decoration-color:var(--text)}
.byline .muted{margin-left:6px}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);border-radius:999px;padding:4px 11px;font-size:13px;font-weight:500;white-space:nowrap}
.chip::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--cat,var(--muted))}
dl.facts{display:grid;grid-template-columns:auto 1fr;gap:8px 22px;margin:22px 0;padding:18px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
dl.facts dt{color:var(--muted);font-size:14px}
dl.facts dd{margin:0;font-size:15px;overflow-wrap:anywhere}
.note{max-width:60ch;color:#c9cad4;margin:0 0 24px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:9px 16px;font-size:14px;font-weight:500;cursor:pointer;text-decoration:none;transition:border-color .15s}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.4;cursor:default}
.btn.primary{background:var(--text);color:var(--ink);border-color:var(--text)}

/* Sections */
section{padding:44px 0}
.sec-head{display:flex;justify-content:space-between;align-items:end;gap:16px;flex-wrap:wrap;margin-bottom:22px}
h2{font-family:var(--f-display);font-weight:600;font-size:clamp(26px,3.2vw,40px);letter-spacing:-.03em;margin:0;line-height:1.05}
.page-head{padding:36px 0 8px}
.page-head h1{font-family:var(--f-display);font-weight:650;font-size:clamp(40px,6vw,84px);letter-spacing:-.04em;line-height:.95;margin:0 0 12px;text-wrap:balance;overflow-wrap:anywhere}
.link-more{color:var(--muted);text-decoration:none;font-weight:500}
.link-more:hover{color:var(--text)}

/* Work cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:28px 22px}
.card{all:unset;cursor:pointer;display:grid;gap:10px;align-content:start}
.card .img{position:relative;border-radius:4px;overflow:hidden;background:var(--panel)}
.card img{width:100%;aspect-ratio:4/5;object-fit:cover;transition:transform .4s ease;background:var(--panel)}
.card:hover img{transform:scale(1.03)}
.card .img::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--cat)}
.card .t{font-weight:600;font-size:15.5px;line-height:1.3;overflow-wrap:anywhere}
.card .a{color:var(--muted);font-size:14px}
.card .meta{display:flex;justify-content:space-between;gap:8px;color:var(--muted)}
.tag{position:absolute;top:8px;right:8px;background:rgba(12,14,19,.75);backdrop-filter:blur(4px);font-size:11px;padding:3px 8px;border-radius:999px;color:var(--muted)}
.group-head{grid-column:1/-1;display:flex;align-items:baseline;gap:12px;border-top:1px solid var(--line);padding-top:18px;margin-top:6px}
.group-head a{font-family:var(--f-display);font-size:24px;font-weight:600;letter-spacing:-.02em;text-decoration:none}
.group-head a:hover{text-decoration:underline;text-underline-offset:4px}
.more-row{display:flex;justify-content:center;padding:32px 0 0}
.empty{color:var(--muted);padding:40px 0}

/* Artist cards */
.artists{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:28px 22px}
.artist{display:grid;gap:12px;text-decoration:none;align-content:start}
.mosaic{display:grid;grid-template-columns:1fr 1fr;gap:3px;border-radius:6px;overflow:hidden;aspect-ratio:1;background:var(--panel)}
.mosaic img{width:100%;height:100%;object-fit:cover;background:var(--panel)}
.mosaic.n1 img{grid-column:1/-1;grid-row:1/3}
.mosaic.n2 img{grid-row:1/3}
.mosaic.n3 img:first-child{grid-row:1/3}
.artist:hover .mosaic{outline:1px solid var(--muted);outline-offset:3px}
.artist .n{font-family:var(--f-display);font-weight:600;font-size:21px;letter-spacing:-.02em;line-height:1.15;overflow-wrap:anywhere}
.artist .c{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:14px;flex-wrap:wrap}
.dots{display:inline-flex;gap:4px}
.dots i{width:8px;height:8px;border-radius:50%}
.artist-row{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(200px,1fr);gap:20px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}

/* Recent strip */
.strip{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(150px,1fr);gap:16px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
.strip button{all:unset;cursor:pointer;display:grid;gap:8px;align-content:start}
.strip img{aspect-ratio:1;object-fit:cover;border-radius:4px;width:100%;background:var(--panel)}
.strip .t{font-weight:600;font-size:14px;line-height:1.3;overflow-wrap:anywhere}

/* Stats + toolbar */
.stats{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:20px 0 28px}
.stat{all:unset;cursor:pointer;background:var(--ink);padding:18px 18px 16px;display:grid;gap:4px;position:relative}
.stat:hover{background:var(--panel)}
.stat::after{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--cat,var(--spectrum))}
.stat .n{font-family:var(--f-display);font-size:34px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.stat .l{color:var(--muted);font-size:14px}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:24px}
.filters{display:flex;gap:8px;flex-wrap:wrap;flex:1 1 auto}
.filters button{border:1px solid var(--line);background:transparent;border-radius:999px;padding:7px 14px;font-size:14px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.filters button .c{color:var(--muted);font-family:var(--f-mono);font-size:12px}
.filters button[aria-pressed="true"]{background:var(--text);color:var(--ink);border-color:var(--text)}
.filters button[aria-pressed="true"] .c{color:var(--ink);opacity:.6}
.filters button::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--cat,var(--spectrum))}
.field{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:999px;padding:0 14px;background:var(--panel)}
.field input,.field select{background:transparent;border:0;padding:8px 0;outline:none;min-width:0}
.field select option{background:var(--panel)}
.search{width:200px}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(6,7,10,.82);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;padding:var(--gutter);z-index:20}
.modal.open{display:flex}
.sheet{background:var(--panel);border:1px solid var(--line);border-radius:10px;max-width:1040px;width:100%;max-height:100%;overflow:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);position:relative}
.sheet .art{padding:24px;background:#10131a}
.sheet .art img{width:100%;aspect-ratio:4/5;object-fit:contain}
.sheet .info{padding:28px 28px 32px}
.sheet h3{font-family:var(--f-display);font-size:34px;letter-spacing:-.03em;line-height:1.05;margin:10px 0 8px;font-weight:650;text-wrap:balance;overflow-wrap:anywhere}
.close{position:absolute;top:12px;right:12px;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--ink);cursor:pointer;font-size:20px;line-height:1;z-index:1}

footer{border-top:1px solid var(--line);margin-top:40px;padding:28px 0 48px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:14px}
.notice{border:1px dashed var(--line);border-radius:8px;padding:12px 16px;color:var(--muted);font-size:14px;margin-top:28px}

@media (max-width:860px){
  .hero{grid-template-columns:1fr}
  .stats{grid-template-columns:repeat(3,minmax(0,1fr))}
  .sheet{grid-template-columns:1fr}
}
@media (max-width:440px){
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .toolbar .field{flex:1 1 100%}
  .search{width:100%}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 14px}
  .artists{grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 14px}
  .artist .n{font-size:17px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="spectrum-rule"></div>
<div class="wrap">
  <header class="top">
    <a class="brand" href="#home">chromospace<span>.art</span></a>
    <nav class="main" aria-label="Sections">
      <a href="#home" data-view="home">Home</a>
      <a href="#artists" data-view="artists">Artists</a>
      <a href="#collection" data-view="collection">Collection</a>
    </nav>
    <div class="status" id="status"><i></i><span id="statusText">Loading the collection…</span></div>
  </header>

  <main>
    <!-- HOME -->
    <div id="view-home" class="view">
      <article class="hero" aria-live="polite">
        <div class="frame" id="heroFrame">
          <img id="heroImg" alt="">
          <span class="badge-new" id="heroNew" hidden>Acquired today</span>
          <div class="bar"></div>
        </div>
        <div>
          <div class="eyebrow"><b>Piece of the day</b><span id="heroDate"></span></div>
          <h1 class="title" id="heroTitle"></h1>
          <p class="byline"><a id="heroArtist" href="#"></a><span class="muted" id="heroYear"></span></p>
          <span class="chip" id="heroCat"></span>
          <dl class="facts" id="heroFacts"></dl>
          <p class="note" id="heroNote"></p>
          <div class="actions">
            <button class="btn" id="prevDay" type="button">← Previous day</button>
            <button class="btn" id="nextDay" type="button">Next day →</button>
            <button class="btn" id="today" type="button" hidden>Back to today</button>
            <button class="btn primary" id="heroOpen" type="button">Open details</button>
          </div>
        </div>
      </article>

      <section>
        <div class="sec-head">
          <h2>Selected NFTs</h2>
          <a class="link-more" href="#collection" data-filter="nft">All <span id="nftCount"></span> NFTs →</a>
        </div>
        <div class="grid" id="featured"></div>
      </section>

      <section>
        <div class="sec-head">
          <h2>Artists</h2>
          <a class="link-more" href="#artists">All <span id="artistCount"></span> artists →</a>
        </div>
        <div class="artist-row" id="topArtists"></div>
      </section>

      <section id="recentSection">
        <div class="sec-head">
          <h2>Latest acquisitions</h2>
        </div>
        <div class="strip" id="recent"></div>
      </section>
    </div>

    <!-- ARTISTS -->
    <div id="view-artists" class="view" hidden>
      <div class="page-head">
        <h1>Artists</h1>
        <p class="muted" id="artistsLine"></p>
      </div>
      <div class="toolbar">
        <label class="field" for="artistQ"><span class="muted" aria-hidden="true">⌕</span><input id="artistQ" class="search" type="search" placeholder="Search artists"></label>
        <label class="field" for="artistSort"><span class="muted">Sort</span>
          <select id="artistSort">
            <option value="count">Most works</option>
            <option value="name">Name A–Z</option>
          </select>
        </label>
      </div>
      <div class="artists" id="artistGrid"></div>
    </div>

    <!-- ONE ARTIST -->
    <div id="view-artist" class="view" hidden>
      <div class="page-head">
        <a class="link-more" href="#artists">← All artists</a>
        <h1 id="artistName" style="margin-top:14px"></h1>
        <p class="muted" id="artistLine"></p>
      </div>
      <section style="padding-top:20px">
        <div class="grid" id="artistWorks"></div>
      </section>
    </div>

    <!-- COLLECTION -->
    <div id="view-collection" class="view" hidden>
      <div class="page-head">
        <h1>The collection</h1>
        <p class="muted mono" id="countLine"></p>
      </div>
      <div class="stats" id="stats"></div>
      <div class="toolbar">
        <div class="filters" id="filters" role="group" aria-label="Filter by category"></div>
        <label class="field" for="q"><span class="muted" aria-hidden="true">⌕</span><input id="q" class="search" type="search" placeholder="Search title or artist"></label>
        <label class="field" for="sort"><span class="muted">Sort</span>
          <select id="sort">
            <option value="artist">By artist</option>
            <option value="recent">Recently acquired</option>
            <option value="title">Title A–Z</option>
          </select>
        </label>
      </div>
      <div class="grid" id="grid"></div>
      <div class="more-row"><button class="btn" id="more" type="button" hidden>Show more</button></div>
    </div>

    <p class="notice" id="exampleNotice" hidden></p>
  </main>

  <footer>
    <span id="footLine">Chromospace · the piece of the day changes at midnight, Rome time</span>
    <span class="mono"><a id="walletLink" href="#">wallet</a></span>
  </footer>
</div>

<div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
  <div class="sheet">
    <button class="close" id="mClose" type="button" aria-label="Close">×</button>
    <div class="art"><img id="mImg" alt=""></div>
    <div class="info">
      <span class="chip" id="mCat"></span>
      <h3 id="mTitle"></h3>
      <p class="byline"><a id="mArtist" href="#"></a><span class="muted" id="mYear"></span></p>
      <dl class="facts" id="mFacts"></dl>
      <p class="note" id="mNote"></p>
      <div class="actions" id="mLinks"></div>
    </div>
  </div>
</div>

<script>
/* ---------- Settings ---------- */
const WALLET = '0xb884ad7ab6af74693fec7f364eb8bfb31fc7ecea';
const TZ = 'Europe/Rome';
const LOCALE = 'en-GB';
const PAGE_SIZE = 36;
const CATS = {
  nft:       { label: 'NFT',           color: 'var(--c-nft)' },
  street:    { label: 'Street art',    color: 'var(--c-street)' },
  prints:    { label: 'Prints',        color: 'var(--c-prints)' },
  paintings: { label: 'Paintings',     color: 'var(--c-paintings)' },
  cards:     { label: 'Trading cards', color: 'var(--c-cards)' }
};

/* ---------- Helpers ---------- */
const $ = id => document.getElementById(id);
function hashStr(s){ let h = 2166136261; for (let i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed){ let a = seed >>> 0; return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slug = s => String(s || '').normalize('NFKD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'unattributed';
function todayKey(){ return new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date()); }
function dayNumber(key){ const [y,m,d] = key.split('-').map(Number); return Math.round(Date.UTC(y,m-1,d)/86400000); }
function keyFromDay(n){ return new Date(n*86400000).toISOString().slice(0,10); }
function fmtDay(key, opts){ const [y,m,d] = key.slice(0,10).split('-').map(Number); return new Intl.DateTimeFormat(LOCALE, Object.assign({timeZone:'UTC'}, opts || {weekday:'long',day:'numeric',month:'long',year:'numeric'})).format(new Date(Date.UTC(y,m-1,d))); }
const shortAddr = a => a ? a.slice(0,6) + '…' + a.slice(-4) : '';
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
async function loadJSON(path){ const r = await fetch(path, { cache: 'no-cache' }); if (!r.ok) throw new Error(path + ' ' + r.status); return r.json(); }

/* ---------- Placeholder tile (only while a real image is missing) ---------- */
const tileCache = new Map();
function placeholderTile(item){
  const k = item.category + '|' + (item.collection || item.artist);
  if (tileCache.has(k)) return tileCache.get(k);
  const label = String(item.collection || item.artist || '').slice(0, 34).replace(/[&<>]/g, '');
  const color = { nft:'#8b6cff', street:'#ff4d6d', prints:'#2ec4f1', paintings:'#ffb020', cards:'#3ddc97' }[item.category] || '#8f94a6';
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500"><rect width="400" height="500" fill="#151821"/><rect x="0" y="494" width="400" height="6" fill="${color}" opacity=".5"/><text x="200" y="240" fill="#8f94a6" font-family="Helvetica,Arial,sans-serif" font-size="18" text-anchor="middle">${label}</text><text x="200" y="272" fill="#5c6172" font-family="Helvetica,Arial,sans-serif" font-size="14" text-anchor="middle">image coming soon</text></svg>`;
  const url = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  tileCache.set(k, url); return url;
}
const hasRealImage = it => !!(it.thumb || it.image);
function setImg(img, item, opts){
  opts = opts || {};
  img.alt = item.title + (item.artist ? ', ' + item.artist : '');
  img.decoding = 'async';
  if (!opts.eager) img.loading = 'lazy';
  const sources = (opts.large ? [item.image, item.thumb] : [item.thumb, item.image]).filter(Boolean);
  let k = 0;
  img.onerror = () => { k++; if (k < sources.length) img.src = sources[k]; else { img.onerror = null; img.src = placeholderTile(item); } };
  img.src = sources.length ? sources[0] : placeholderTile(item);
}

/* ---------- Data ---------- */
let ITEMS = [], ARTISTS = [], FEATURED = [], NFT_META = {}, ARCHIVE = { items: {} };
function normalise(physical, nfts, artists, exclude){
  const lc = s => String(s || '').toLowerCase();
  const byContract = {}; Object.entries((artists && artists.contracts) || {}).forEach(([k,v]) => byContract[lc(k)] = v);
  const byToken = {}; Object.entries((artists && artists.tokens) || {}).forEach(([k,v]) => byToken[lc(k)] = v);
  const exC = new Set(((exclude && exclude.contracts) || []).map(lc)), exN = new Set(((exclude && exclude.collections) || []).map(lc));
  const keep = new Set(((exclude && exclude.keep) || []).map(lc));
  const exT = new Set(((exclude && exclude.tokens) || []).map(lc));
  const phys = (physical.items || []).map(p => Object.assign({}, p, { category: CATS[p.category] ? p.category : 'paintings' }));
  const nft = (nfts.items || []).filter(n => !exT.has(lc(n.key))).filter(n => keep.has(lc(n.key)) || (!exC.has(lc(n.contract)) && !exN.has(lc(n.collection)))).map(n => Object.assign({}, n, {
    category: 'nft',
    artist: byToken[lc(n.key)] || byContract[lc(n.contract)] || n.artist || n.collection || 'Unattributed',
    medium: [n.standard || 'NFT', 'Ethereum'].join(' · '),
    edition: n.copies ? n.copies + ' editions' : ''
  }));
  return phys.concat(nft).map(it => Object.assign(it, { artistSlug: slug(it.artist) }));
}
function buildArtists(){
  const map = new Map();
  ITEMS.forEach(it => {
    if (!map.has(it.artistSlug)) map.set(it.artistSlug, { slug: it.artistSlug, name: it.artist, works: [] });
    map.get(it.artistSlug).works.push(it);
  });
  ARTISTS = [...map.values()];
  ARTISTS.forEach(a => {
    a.works.sort((x,y) => (hasRealImage(y) - hasRealImage(x)) || (y.acquired || '').localeCompare(x.acquired || ''));
    a.cats = [...new Set(a.works.map(w => w.category))];
  });
}
function pickFeatured(list){
  const nfts = ITEMS.filter(i => i.category === 'nft');
  const out = [];
  (list || []).map(s => String(s).toLowerCase().trim()).filter(Boolean).forEach(w => {
    const hit = nfts.find(n => n.title.toLowerCase() === w || (n.key && n.key.toLowerCase() === w));
    if (hit && !out.includes(hit)) out.push(hit);
  });
  // Works with a real image go first; then top up with the newest work of other artists.
  const ordered = out.filter(hasRealImage).concat(out.filter(i => !hasRealImage(i)));
  const seen = new Set(ordered.map(n => n.artistSlug));
  nfts.slice().sort((a,b) => (!!b.thumb - !!a.thumb) || (b.acquired || '').localeCompare(a.acquired || '')).forEach(n => {
    if (ordered.length < 8 && n.thumb && !seen.has(n.artistSlug)){ seen.add(n.artistSlug); ordered.push(n); }
  });
  return ordered.slice(0, 12);
}

/* ---------- Shared pieces ---------- */
function factsHTML(it){
  const rows = [
    ['Inventory', `<span class="mono">${esc(it.id)}</span>`],
    it.collection && it.collection !== it.artist ? ['Collection', esc(it.collection)] : null,
    it.medium ? ['Medium', esc(it.medium)] : null,
    it.size ? ['Size', esc(it.size)] : null,
    it.edition ? ['Edition', `<span class="mono">${esc(it.edition)}</span>`] : null,
    ['Acquired', it.acquired ? esc(fmtDay(it.acquired, {day:'numeric',month:'long',year:'numeric'})) : 'Date not recorded'],
    it.provenance ? ['Provenance', esc(it.provenance)] : null,
    it.contract ? ['Token', `<span class="mono">${esc(shortAddr(it.contract))} · #${esc(String(it.tokenId).slice(0,14))}</span>`] : null
  ].filter(Boolean);
  return rows.map(([k,v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
}
function tagFor(it){
  if (it.example) return '<span class="tag">example</span>';
  return '';
}
function workCard(it){
  const b = document.createElement('button'); b.type = 'button'; b.className = 'card';
  b.style.setProperty('--cat', CATS[it.category].color);
  b.innerHTML = `<div class="img"><img alt="">${tagFor(it)}</div>
    <div><div class="t">${esc(it.title)}</div><div class="a">${esc(it.artist)}${it.year ? ' · ' + it.year : ''}</div></div>
    <div class="meta mono"><span>${esc(it.id)}</span><span>${CATS[it.category].label}</span></div>`;
  setImg(b.querySelector('img'), it);
  b.onclick = () => openModal(it);
  return b;
}
/* Artist mosaics: 4 works picked at random, a new pick every day (midnight, Rome time) */
function shuffle(arr, rand){ for (let i = arr.length - 1; i > 0; i--){ const j = Math.floor(rand() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; }
function artistCard(a){
  const el = document.createElement('a'); el.className = 'artist'; el.href = '#artist-' + a.slug;
  const withImg = a.works.filter(hasRealImage);
  const pool = withImg.length ? withImg : a.works;
  const pics = shuffle(pool.slice().sort((x,y) => x.id.localeCompare(y.id)), rng(hashStr(a.slug + todayKey()))).slice(0, 4);
  el.innerHTML = `<div class="mosaic n${pics.length}">${pics.map(() => '<img alt="">').join('')}</div>
    <div><div class="n">${esc(a.name)}</div>
    <div class="c"><span>${plural(a.works.length, 'work')}</span><span class="dots">${a.cats.map(c => `<i style="background:${CATS[c].color}" title="${CATS[c].label}"></i>`).join('')}</span></div></div>`;
  el.querySelectorAll('img').forEach((img, i) => { setImg(img, pics[i]); img.alt = ''; });
  return el;
}
const artistHref = it => '#artist-' + it.artistSlug;

/* ---------- Home ---------- */
let dayOffset = 0, heroItem = null;
function pickForDay(key){
  const fresh = ITEMS.filter(i => i.acquired === key);
  if (fresh.length) return { item: fresh[fresh.length-1], isNew: true };
  const withImg = ITEMS.filter(i => i.thumb || (i.image && i.category !== 'nft'));
  const order = (withImg.length >= 7 ? withImg : ITEMS).slice().sort((a,b) => a.id.localeCompare(b.id));
  const r = rng(20261113);
  for (let i=order.length-1; i>0; i--){ const j = Math.floor(r()*(i+1)); [order[i], order[j]] = [order[j], order[i]]; }
  return { item: order[((dayNumber(key) % order.length) + order.length) % order.length], isNew: false };
}
function renderHero(){
  const key = keyFromDay(dayNumber(todayKey()) + dayOffset);
  const { item, isNew } = pickForDay(key);
  heroItem = item;
  const cat = CATS[item.category];
  $('heroFrame').style.setProperty('--cat', cat.color);
  setImg($('heroImg'), item, { eager: true, large: true });
  $('heroNew').hidden = !isNew;
  $('heroDate').textContent = (dayOffset === 0 ? 'today, ' : '') + fmtDay(key);
  $('heroTitle').textContent = item.title;
  $('heroArtist').textContent = item.artist; $('heroArtist').href = artistHref(item);
  $('heroYear').textContent = item.year || '';
  $('heroCat').textContent = cat.label; $('heroCat').style.setProperty('--cat', cat.color);
  $('heroFacts').innerHTML = factsHTML(item);
  $('heroNote').textContent = item.note || '';
  $('today').hidden = dayOffset === 0;
  $('nextDay').disabled = dayOffset >= 0;
}
function renderHome(){
  renderHero();
  const f = $('featured'); f.innerHTML = '';
  FEATURED.forEach(it => f.appendChild(workCard(it)));
  $('nftCount').textContent = ITEMS.filter(i => i.category === 'nft').length;
  const top = ARTISTS.filter(a => a.slug !== 'unattributed').sort((a,b) => b.works.length - a.works.length || a.name.localeCompare(b.name)).slice(0, 10);
  const ta = $('topArtists'); ta.innerHTML = ''; top.forEach(a => ta.appendChild(artistCard(a)));
  $('artistCount').textContent = ARTISTS.length;
  const rec = ITEMS.filter(i => i.acquired).sort((a,b) => b.acquired.localeCompare(a.acquired)).slice(0, 10);
  $('recentSection').hidden = !rec.length;
  const rs = $('recent'); rs.innerHTML = '';
  rec.forEach(it => {
    const b = document.createElement('button'); b.type = 'button';
    b.innerHTML = `<img alt=""><span class="t">${esc(it.title)}</span><span class="mono muted">${esc(fmtDay(it.acquired,{day:'numeric',month:'short',year:'numeric'}))} · ${CATS[it.category].label}</span>`;
    setImg(b.querySelector('img'), it);
    b.onclick = () => openModal(it);
    rs.appendChild(b);
  });
}

/* ---------- Artists ---------- */
function renderArtists(){
  const q = $('artistQ').value.trim().toLowerCase();
  let list = ARTISTS.filter(a => !q || a.name.toLowerCase().includes(q));
  list.sort($('artistSort').value === 'name' ? (a,b) => a.name.localeCompare(b.name, 'en') : (a,b) => b.works.length - a.works.length || a.name.localeCompare(b.name, 'en'));
  list.sort((a,b) => (a.slug === 'unattributed') - (b.slug === 'unattributed'));
  $('artistsLine').textContent = `${plural(ARTISTS.length, 'artist')} · ${plural(ITEMS.length, 'work')}`;
  const g = $('artistGrid'); g.innerHTML = '';
  if (!list.length){ g.innerHTML = '<p class="empty">No artist matches your search.</p>'; return; }
  list.forEach(a => g.appendChild(artistCard(a)));
}
function renderArtist(s){
  const a = ARTISTS.find(x => x.slug === s);
  if (!a){ $('artistName').textContent = 'Artist not found'; $('artistLine').textContent = ''; $('artistWorks').innerHTML = ''; return; }
  document.title = a.name + ' · Chromospace';
  $('artistName').textContent = a.name;
  $('artistLine').textContent = `${plural(a.works.length, 'work')} in the collection · ` + a.cats.map(c => CATS[c].label).join(', ');
  const g = $('artistWorks'); g.innerHTML = '';
  a.works.forEach(it => g.appendChild(workCard(it)));
}

/* ---------- Collection ---------- */
let filter = 'all', query = '', sortBy = 'artist', shown = PAGE_SIZE;
function counts(){ const c = { all: ITEMS.length }; Object.keys(CATS).forEach(k => c[k] = ITEMS.filter(i => i.category === k).length); return c; }
function renderStats(){
  const c = counts();
  const tiles = [['all','Works in total','var(--spectrum)'], ...Object.keys(CATS).filter(k => c[k]).map(k => [k, CATS[k].label, CATS[k].color])];
  $('stats').style.gridTemplateColumns = `repeat(${Math.min(tiles.length, 6)}, minmax(0,1fr))`;
  $('stats').innerHTML = tiles.map(([k,l,col]) => `<button class="stat" type="button" data-k="${k}" style="--cat:${col}"><span class="n">${c[k]}</span><span class="l">${l}</span></button>`).join('');
  $('stats').querySelectorAll('.stat').forEach(b => b.onclick = () => { setFilter(b.dataset.k); });
  $('countLine').textContent = `${plural(ITEMS.length, 'work')} · ${plural(ARTISTS.length, 'artist')}`;
}
function renderFilters(){
  const c = counts();
  const opts = [['all','All','var(--spectrum)'], ...Object.keys(CATS).filter(k => c[k]).map(k => [k, CATS[k].label, CATS[k].color])];
  $('filters').hidden = opts.length <= 2;
  $('filters').innerHTML = opts.map(([k,l,col]) => `<button type="button" data-k="${k}" aria-pressed="${filter===k}" style="--cat:${col}">${l}<span class="c">${c[k]}</span></button>`).join('');
  $('filters').querySelectorAll('button').forEach(b => b.onclick = () => setFilter(b.dataset.k));
}
function setFilter(k){ filter = k; shown = PAGE_SIZE; renderFilters(); renderGrid(); }
function renderGrid(){
  let list = ITEMS.filter(i => filter === 'all' || i.category === filter);
  if (query){ const q = query.toLowerCase(); list = list.filter(i => (i.title + ' ' + i.artist + ' ' + (i.collection || '')).toLowerCase().includes(q)); }
  const cmp = {
    artist: (a,b) => ((a.artistSlug === 'unattributed') - (b.artistSlug === 'unattributed')) || a.artist.localeCompare(b.artist, 'en') || a.title.localeCompare(b.title, 'en', { numeric: true }),
    recent: (a,b) => (b.acquired || '').localeCompare(a.acquired || ''),
    title: (a,b) => a.title.localeCompare(b.title, 'en', { numeric: true })
  }[sortBy];
  list.sort(cmp);
  const g = $('grid'); g.innerHTML = '';
  if (!list.length){ g.innerHTML = '<p class="empty">No works match your search.</p>'; $('more').hidden = true; return; }
  let lastArtist = null;
  list.slice(0, shown).forEach(it => {
    if (sortBy === 'artist' && it.artistSlug !== lastArtist){
      lastArtist = it.artistSlug;
      const n = list.filter(x => x.artistSlug === it.artistSlug).length;
      const h = document.createElement('div'); h.className = 'group-head';
      h.innerHTML = `<a href="${artistHref(it)}">${esc(it.artist)}</a><span class="muted mono">${n}</span>`;
      g.appendChild(h);
    }
    g.appendChild(workCard(it));
  });
  $('more').hidden = list.length <= shown;
  $('more').textContent = `Show more (${list.length - shown} left)`;
}
function renderCollection(){ renderStats(); renderFilters(); renderGrid(); }

/* ---------- Modal ---------- */
let lastFocus = null;
function openModal(it){
  lastFocus = document.activeElement;
  const cat = CATS[it.category];
  setImg($('mImg'), it, { eager: true, large: true });
  $('mCat').textContent = cat.label; $('mCat').style.setProperty('--cat', cat.color);
  $('mTitle').textContent = it.title;
  $('mArtist').textContent = it.artist; $('mArtist').href = artistHref(it);
  $('mYear').textContent = it.year || '';
  $('mFacts').innerHTML = factsHTML(it);
  $('mNote').textContent = it.note || '';
  const links = [`<a class="btn" href="${artistHref(it)}">More by ${esc(it.artist)}</a>`];
  const saved = it.key && ARCHIVE.items && ARCHIVE.items[it.key];
  if (saved && saved.image) links.push(`<a class="btn" href="${esc(ARCHIVE.base + saved.image)}" target="_blank" rel="noopener">Original file</a>`);
  if (saved && saved.animation) links.push(`<a class="btn" href="${esc(ARCHIVE.base + saved.animation)}" target="_blank" rel="noopener">Original video</a>`);
  if (it.contract && it.tokenId){
    links.push(`<a class="btn" href="https://opensea.io/item/ethereum/${esc(it.contract)}/${esc(it.tokenId)}" target="_blank" rel="noopener">OpenSea</a>`);
    links.push(`<a class="btn" href="https://etherscan.io/nft/${esc(it.contract)}/${esc(it.tokenId)}" target="_blank" rel="noopener">Etherscan</a>`);
  }
  $('mLinks').innerHTML = links.join('');
  $('mLinks').querySelector('a').onclick = closeModal;
  $('modal').classList.add('open');
  $('mClose').focus();
}
function closeModal(){ $('modal').classList.remove('open'); if (lastFocus && document.body.contains(lastFocus)) lastFocus.focus(); }

/* ---------- Router (#home, #artists, #artist-name, #collection) ---------- */
function route(){
  const h = decodeURIComponent(location.hash.slice(1));
  let view = 'home';
  if (h === 'artists') view = 'artists';
  else if (h === 'collection') view = 'collection';
  else if (h.startsWith('artist-')) view = 'artist';
  document.querySelectorAll('.view').forEach(v => v.hidden = v.id !== 'view-' + view);
  document.querySelectorAll('nav.main a').forEach(a => a.toggleAttribute('aria-current', a.dataset.view === view || (view === 'artist' && a.dataset.view === 'artists')));
  document.querySelectorAll('nav.main a[aria-current]').forEach(a => a.setAttribute('aria-current', 'page'));
  document.title = 'Chromospace';
  if (!ITEMS.length) return;
  if (view === 'home') renderHome();
  if (view === 'artists') renderArtists();
  if (view === 'artist') renderArtist(h.slice(7));
  if (view === 'collection') renderCollection();
  if ($('modal').classList.contains('open')) closeModal();
  window.scrollTo(0, 0);
}

/* ---------- Start ---------- */
$('prevDay').onclick = () => { dayOffset--; renderHero(); };
$('nextDay').onclick = () => { if (dayOffset < 0){ dayOffset++; renderHero(); } };
$('today').onclick = () => { dayOffset = 0; renderHero(); };
$('heroOpen').onclick = () => heroItem && openModal(heroItem);
$('mClose').onclick = closeModal;
$('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('modal').classList.contains('open')) closeModal(); });
$('q').addEventListener('input', e => { query = e.target.value.trim(); shown = PAGE_SIZE; renderGrid(); });
$('sort').addEventListener('change', e => { sortBy = e.target.value; shown = PAGE_SIZE; renderGrid(); });
$('more').onclick = () => { shown += PAGE_SIZE; renderGrid(); };
$('artistQ').addEventListener('input', renderArtists);
$('artistSort').addEventListener('change', renderArtists);
document.querySelector('[data-filter="nft"]').addEventListener('click', () => { filter = 'nft'; shown = PAGE_SIZE; });
$('walletLink').textContent = 'wallet ' + shortAddr(WALLET);
$('walletLink').href = 'https://etherscan.io/address/' + WALLET;
window.addEventListener('hashchange', route);

const optional = p => loadJSON(p).catch(() => ({}));
Promise.all([optional('data/physical.json'), loadJSON('data/nfts.json'), optional('data/featured.json'), optional('data/artists.json'), optional('data/exclude.json'), optional('data/archive.json')])
  .then(([physical, nfts, featured, artists, exclude, archive]) => {
    NFT_META = nfts;
    if (archive && archive.items) ARCHIVE = archive;
    ITEMS = normalise(physical, nfts, artists, exclude);
    buildArtists();
    FEATURED = pickFeatured(featured.items);
    const live = nfts.source && !/snapshot/i.test(nfts.source);
    const nftTotal = ITEMS.filter(i => i.category === 'nft').length;
    if (live){
      $('status').className = 'status ok';
      $('statusText').textContent = `${plural(nftTotal, 'NFT')} · updated ${fmtDay(nfts.updated, {day:'numeric', month:'short'})}`;
    } else {
      $('statusText').textContent = 'NFT list from an OpenSea snapshot · daily update not run yet';
    }
    const notes = [];
    if (ITEMS.some(i => i.example)) notes.push('Works tagged “example” are placeholders.');
    $('exampleNotice').textContent = notes.join(' ');
    $('exampleNotice').hidden = !notes.length;
    route();
  })
  .catch(err => {
    $('statusText').textContent = 'The collection could not be loaded. Reload the page to try again.';
    console.error(err);
  });
</script>
</body>
